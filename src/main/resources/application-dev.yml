# Profilo per giocare senza MySQL: database H2 in memoria.
# Avvio: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  datasource:
    # MODE=MySQL: lo stesso script Flyway vale per H2 e per MySQL
    url: jdbc:h2:mem:monopoly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      # devtools la abiliterebbe da solo: con la porta del Codespace pubblica chiunque
      # potrebbe eseguire SQL e codice Java. Il valore esplicito prevale sul default.
      enabled: false
