server:
  port: 8080
  servlet:
    session:
      # evita il ;jsessionid=... negli URL dei redirect (Spring 6 risponderebbe 404)
      tracking-modes: cookie

spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": false
        "[storage_engine]": innodb
    generate-ddl: true
  datasource:
    # Credenziali da variabili d'ambiente (in VS Code: file .env, letto da launch.json ed escluso da git)
    url: ${DB_URL:jdbc:mysql://localhost:3306/monopoly?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:luke}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    allow-bean-definition-overriding: true
  web:
    resources:
      chain:
        strategy:
          content:
            # JS e CSS servite con un hash nel nome (es. monopoly-3f2a....js):
            # a ogni modifica cambia l'indirizzo e il browser non usa la copia vecchia
            enabled: true
            paths: /js/**,/css/**
